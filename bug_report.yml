name: 问题反馈
description: 报告 CraftBridge 的错误或异常。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索是否已有相同问题。日志和截图请隐去账号、令牌及个人路径，不要上传真实存档或整个游戏目录。
  - type: input
    id: version
    attributes:
      label: CraftBridge 版本
      placeholder: "例如：v0.2.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用环境
      description: Windows 版本、启动器、Minecraft 版本和加载器。
      placeholder: "例如：Windows 11 / HMCL / 1.20.1 / Fabric"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      description: 从选择导出或导入开始，描述操作步骤。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际结果与预期结果
      description: 出现了什么问题，你希望正常情况下发生什么。
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 错误提示或补充信息
      description: 可附脱敏后的提示文字或截图；请保留自己的原始 ZIP 和备份。
